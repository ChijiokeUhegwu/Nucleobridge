<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 300" width="100%" height="100%">
  <!-- Icon Group -->
  <g transform="translate(16, 20)">
    <!-- Background Circle -->
    <circle cx="130" cy="130" r="120" fill="#005B48" />
    
    <!-- Molecular Bridge Structure -->
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Main Diagonal Connecting Lines -->
      <line x1="60" y1="75" x2="200" y2="185" />
      <line x1="60" y1="185" x2="200" y2="75" />
      
      <!-- Vertical Dashed Bridge/H-Bonds -->
      <line x1="97" y1="104" x2="97" y2="156" stroke-dasharray="8,6" stroke-width="3.5" />
      <line x1="163" y1="104" x2="163" y2="156" stroke-dasharray="8,6" stroke-width="3.5" />
      
      <!-- Outer Large Nodes -->
      <circle cx="60" cy="75" r="15" stroke="none" />
      <circle cx="60" cy="185" r="15" stroke="none" />
      <circle cx="200" cy="75" r="15" stroke="none" />
      <circle cx="200" cy="185" r="15" stroke="none" />
      
      <!-- Inner Mid-size Nodes -->
      <circle cx="97" cy="104" r="9" stroke="none" />
      <circle cx="97" cy="156" r="9" stroke="none" />
      <circle cx="163" cy="104" r="9" stroke="none" />
      <circle cx="163" cy="156" r="9" stroke="none" />
      
      <!-- Center Node -->
      <circle cx="130" cy="130" r="11" stroke="none" />
    </g>
  </g>
  
  <!-- Typography Group using Plus Jakarta Sans -->
  <text x="278" y="171" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="114" 
        font-weight="600"
        fill="#005B48" 
        letter-spacing="-2.8px">
    <tspan>Nucleo</tspan><tspan>Bridge</tspan>
  </text>
</svg>
